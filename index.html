<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>금융연수원 주간 식단</title>
  <meta name="description" content="금융연수원 주간 식단표와 메뉴별 칼로리">
  <meta name="theme-color" content="#0B2A5B">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="연수원 식단">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>금융연수원 주간 식단</h1>
      <nav class="week-nav" aria-label="주간 이동">
        <button type="button" id="prev-week" class="icon-btn" aria-label="지난주 식단">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <p id="week-range" class="week-range" aria-live="polite"></p>
        <button type="button" id="next-week" class="icon-btn" aria-label="다음주 식단">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </nav>
      <button type="button" id="this-week" class="this-week-btn" hidden>이번 주로</button>
    </header>

    <main>
      <div id="day-tabs" class="day-tabs" role="tablist" aria-label="요일 선택"></div>
      <div id="content" class="content" role="tabpanel" aria-live="polite"></div>
    </main>
  </div>

  <noscript>
    <p class="noscript">이 페이지는 JavaScript가 켜져 있어야 식단을 볼 수 있습니다.</p>
  </noscript>
  <script src="js/app.js"></script>
</body>
</html>
